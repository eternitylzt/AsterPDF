name: Desktop builds
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - run: python -m pip install -e ".[dev]"
      - name: Native Qt tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -q
      - name: Headless Qt tests (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/collect_licenses.py
      - run: python -m PyInstaller --noconfirm AsterPDF.spec
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: AsterPDF-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## AsterPDF 1.0.1

          AsterPDF is an offline desktop PDF workspace for research and technical documents: read, edit, animate, annotate and extract.

          AsterPDF 是面向科研与技术文档的本地桌面 PDF 工作台，支持阅读、编辑、动画、批注与提取。

          ### Downloads / 下载

          - Windows x64 portable archive
          - macOS Apple Silicon portable app archive
          - Linux x64 portable archive
          - Matching source archive and SHA-256 checksum files

          These packages are unsigned. Extract the complete archive before running. Platform build completion verifies native packaging; see `docs/VALIDATION.md` and `docs/COMPATIBILITY.md` for the separately tested behavior and known limits.

          这些软件包尚未签名。请完整解压后运行。各平台构建完成表示原生打包成功；已实测功能与已知限制请查看 `docs/VALIDATION.md` 和 `docs/COMPATIBILITY.md`。
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "AsterPDF 1.0.1" --notes-file release-notes.md release-assets/*

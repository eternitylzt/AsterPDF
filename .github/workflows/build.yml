name: Desktop builds
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - run: python -m pip install -e ".[dev]"
      - name: Release workflow regressions (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -q tests/test_release_101.py tests/test_release_11.py tests/test_pdf_workflows.py tests/test_preservation.py tests/test_release_120.py tests/test_release_121.py -k "not video_selection_layer_and_playback"
      - name: Release workflow regressions (Linux headless)
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_release_101.py tests/test_release_11.py tests/test_pdf_workflows.py tests/test_preservation.py tests/test_release_120.py tests/test_release_121.py -k "not video_selection_layer_and_playback"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/collect_licenses.py
      - run: python -m PyInstaller --noconfirm AsterPDF.spec
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: AsterPDF-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "AsterPDF ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE_NOTES.md --latest release-assets/*

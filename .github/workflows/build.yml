name: Desktop builds
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux glibc 2.28 build and packages
        if: runner.os == 'Linux'
        run: |
          docker build -f packaging/linux/Dockerfile -t asterpdf-linux .
          id=$(docker create asterpdf-linux)
          docker cp "$id:/src/dist" linux-dist
          docker rm "$id"
          mkdir -p dist
          cp linux-dist/AsterPDF-*-linux-* linux-dist/*.deb linux-dist/*.rpm dist/
      - run: python -m pip install -e ".[dev]"
        if: runner.os != 'Linux'
      - name: Release workflow regressions (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -q tests/test_release_101.py tests/test_release_11.py tests/test_pdf_workflows.py tests/test_preservation.py tests/test_release_120.py tests/test_release_121.py -k "not video_selection_layer_and_playback"
      - run: python scripts/collect_licenses.py
        if: runner.os != 'Linux'
      - run: python -m PyInstaller --noconfirm AsterPDF.spec
        if: runner.os != 'Linux'
      - run: python scripts/package.py
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: AsterPDF-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "AsterPDF ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE_NOTES.md --latest release-assets/*

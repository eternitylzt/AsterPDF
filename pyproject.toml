[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asterpdf"
version = "1.2.1"
description = "Read · Edit · Animate · Annotate · Extract — a local scientific PDF workspace"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
dependencies = ["PySide6==6.10.2", "PyMuPDF==1.27.1", "pikepdf==10.3.0", "Pillow>=11,<13", "markdown-it-py==4.0.0", "mdit-py-plugins==0.5.0", "linkify-it-py==2.0.3", "quickjs-ng==0.16.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.16,<7", "reportlab>=4,<6"]

[project.gui-scripts]
asterpdf = "asterpdf.app:main"

[tool.setuptools.packages.find]
include = ["asterpdf*"]

[tool.setuptools.package-data]
asterpdf = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
